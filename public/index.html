<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>КУРСОР — Школа программирования</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/uploads/mascot/happy.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=32">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px"><span id="langSlot"></span></div>
    <img src="/img/kursor-logo.webp" alt="KURSOR" style="display:block;width:min(280px,80%);height:auto;margin:8px auto 16px">
    <img class="mascot-lg" src="/uploads/mascot/happy.png" alt="Маскот КУРСОР" style="display:block;margin:0 auto 8px">
    <h1 data-i18n="dash.greeting">Привет!</h1>
    <p data-i18n="auth.title">Войди и начнём программировать!</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="login" data-i18n="auth.login_ph">Логин</label>
        <input class="form-input" type="text" id="login" placeholder="твой логин" data-i18n-ph="auth.login_ph" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" data-i18n="auth.password_ph">Пароль</label>
        <div style="position:relative">
          <input class="form-input" style="padding-right:54px" type="password" id="password" placeholder="пароль" data-i18n-ph="auth.password_ph" required autocomplete="current-password">
          <button type="button" class="btn btn-ghost btn-sm" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);padding:8px" onclick="togglePassword('password',this)" data-i18n-title="auth.show_password" aria-label="Показать пароль"><svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9"><use href="/img/ui-icons.svg#eye"></use></svg></button>
        </div>
      </div>
      <button type="submit" class="btn btn-lg" id="submitBtn" style="width:100%" data-i18n="auth.signin">Войти</button>
    </form>
    <button type="button" class="btn btn-ghost btn-sm" style="display:block;margin:10px auto 0" onclick="toggleRecovery()" data-i18n="auth.forgot">Забыли пароль?</button>
    <form id="recoveryForm" hidden style="margin-top:12px;padding:14px;border:1px solid #e2e8f0;border-radius:14px;text-align:left">
      <p style="font-size:13px;color:#64748b;margin:0 0 10px" data-i18n="auth.recovery_hint">Введите логин. Администратор или куратор проверит заявку и отправит новый доступ на WhatsApp родителя.</p>
      <input class="form-input" id="recoveryLogin" autocomplete="username" placeholder="Ваш логин" data-i18n-ph="auth.login_ph" required>
      <button class="btn" type="submit" style="width:100%;margin-top:10px" data-i18n="auth.restore">Отправить заявку</button>
      <div id="recoveryMsg" role="alert" aria-live="polite" style="margin-top:8px;font-size:13px;font-weight:700"></div>
    </form>

    <p style="margin-top:18px;font-size:13px;color:#64748b;text-align:center">
      Нет аккаунта? Попроси администратора создать его для тебя.
    </p>

    <div id="msg" role="alert" aria-live="assertive" style="margin-top:14px;color:#ef4444;font-weight:700;text-align:center"></div>
  </div>
</div>

<script src="/data/database.js?v=32"></script>
<script src="/js/i18n.js?v=32"></script>
<script src="/js/api.js?v=32"></script>
<script>
document.getElementById('langSlot').innerHTML = I18N.switcherHtml();
function togglePassword(id,button){const input=document.getElementById(id),show=input.type==='password';input.type=show?'text':'password';button.innerHTML=`<svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9"><use href="/img/ui-icons.svg#${show?'eye-off':'eye'}"></use></svg>`;button.setAttribute('aria-label',I18N.t(show?'auth.hide_password':'auth.show_password'));}
function toggleRecovery(){const form=document.getElementById('recoveryForm');form.hidden=!form.hidden;if(!form.hidden)document.getElementById('recoveryLogin').focus();}

(function () {
  const u = API.getCurrentUser();
  if (u) API.refreshCurrentUser().then(redirectUser).catch(() => {});
})();

function redirectUser(user) {
  if (user.mustChangePassword) location.href = '/change-password.html';
  else redirectByRole(user.role);
}

function redirectByRole(role) {
  if (role === 'admin') location.href = '/admin/index.html';
  else if (role === 'curator') location.href = '/curator/index.html';
  else if (role === 'teacher' || role === 'assistant') location.href = '/pages/teacher.html';
  else if (role === 'parent') location.href = '/pages/parent.html';
  else location.href = '/pages/dashboard.html';
}

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  msg.textContent = '';
  btn.disabled = true; btn.textContent = I18N.t('common.loading');
  try {
    const user = await API.login(login, password);
    redirectUser(user);
  } catch (err) {
    msg.textContent = err.message || I18N.t('auth.error');
    btn.disabled = false; btn.textContent = I18N.t('auth.signin');
  }
});
document.getElementById('recoveryForm').addEventListener('submit',async function(e){
  e.preventDefault();const box=document.getElementById('recoveryMsg');box.style.color='#64748b';box.textContent=I18N.t('common.loading');
  try{const result=await API._request('POST','/api/auth/password-reset/request',{login:recoveryLogin.value.trim()});box.style.color='#16a34a';box.textContent=result.message||I18N.t('auth.restored');this.reset();}
  catch(err){box.style.color='#ef4444';box.textContent=err.message||I18N.t('common.error');}
});
</script>
</body>
</html>
